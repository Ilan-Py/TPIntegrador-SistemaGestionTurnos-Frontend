<div class="registro-container">
  <mat-card class="registro-card">
    <mat-card-header>
      <mat-icon mat-card-avatar>person_add</mat-icon>
      <mat-card-title>Crear cuenta</mat-card-title>
      <mat-card-subtitle>Registrate como paciente</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <app-form-paciente textoBoton="Crear cuenta" (registrado)="onRegistrado()" />
    </mat-card-content>

    <mat-card-actions>
      <p>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
    </mat-card-actions>
  </mat-card>
</div>
